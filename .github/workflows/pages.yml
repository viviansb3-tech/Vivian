name: Validate and deploy portfolio to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  integrity:
    name: Production integrity gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build clean release
        env:
          PORTFOLIO_SITE_URL: ${{ vars.PORTFOLIO_SITE_URL }}
        run: npm run build
      - name: Run production QA
        run: npm run qa:dist
      - name: Smoke-test key routes
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/portfolio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for ATTEMPT in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/application-brief.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/projects/tutoring-platform.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/thanks.html >/dev/null
      - name: Upload validated release
        uses: actions/upload-artifact@v4
        with:
          name: validated-release
          path: dist/
          retention-days: 1

  lighthouse:
    name: Lighthouse deployment gate
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build clean release
        env:
          PORTFOLIO_SITE_URL: ${{ vars.PORTFOLIO_SITE_URL }}
        run: npm run build
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x
      - name: Run Lighthouse CI
        run: lhci autorun --config=./lighthouserc.cjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-deployment-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy validated release
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [integrity, lighthouse]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated release
        uses: actions/download-artifact@v4
        with:
          name: validated-release
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  post_deploy_audit:
    name: Audit live deployment and release identity
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit deployed site
        run: node tools/audit-live.mjs "${{ needs.deploy.outputs.page_url }}"
      - name: Upload live audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-deployment-audit
          path: live-audit.json
          if-no-files-found: ignore
          retention-days: 30
