name: Portfolio quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: Build and integrity audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build clean release
        env:
          PORTFOLIO_SITE_URL: ${{ vars.PORTFOLIO_SITE_URL }}
        run: npm run build
      - name: Run production QA
        run: npm run qa:dist
      - name: Static-server smoke test
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/portfolio-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          for ATTEMPT in 1 2 3 4 5; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/application-brief.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/projects/hotelling-simulation.html >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:4173/thanks.html >/dev/null

  lighthouse:
    name: Lighthouse baseline
    runs-on: ubuntu-latest
    needs: integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build clean release
        env:
          PORTFOLIO_SITE_URL: ${{ vars.PORTFOLIO_SITE_URL }}
        run: npm run build
      - name: Install Lighthouse CI
        run: npm install --global @lhci/cli@0.15.x
      - name: Run Lighthouse CI
        run: lhci autorun --config=./lighthouserc.cjs
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
